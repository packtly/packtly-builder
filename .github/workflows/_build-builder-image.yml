name: Build builder image

on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Podman
        uses: ./.github/actions/setup-podman

      - name: Create pip.conf
        uses: ./.github/actions/create-pip-conf

      - name: Build base image
        uses: redhat-actions/buildah-build@061ffd31bb5c3f8733a6f9bbdf00a9fb02eb708c
        with:
          image: packtly-builder-base
          tags: latest
          containerfiles: packtly-builder/containers/Containerfile
          context: packtly-builder
          build-args: |
            BASE=debian:trixie-slim
            CONTEXT_ROOT=containers
            VERSION=${{ inputs.release_version }}
          extra-args: |
            --target base
            --secret id=pip.conf,src=${{ runner.temp }}/pip.conf
          oci: true

      - name: Build builder image
        uses: redhat-actions/buildah-build@061ffd31bb5c3f8733a6f9bbdf00a9fb02eb708c
        with:
          image: packtly-builder-builder
          tags: latest
          containerfiles: packtly-builder/containers/Containerfile
          context: packtly-builder
          build-args: |
            BASE=packtly-builder-base:latest
            CONTEXT_ROOT=containers
            VERSION=${{ inputs.release_version }}
          extra-args: |
            --target build
            --secret id=pip.conf,src=${{ runner.temp }}/pip.conf
          oci: true

      - name: Export builder image
        run: |
          podman save \
            --format oci-archive \
            packtly-builder-builder:latest \
            | zstd -T0 -10 -o builder.tar.zst

      - name: Upload builder image
        uses: actions/upload-artifact@v7
        with:
          name: builder-image-${{ matrix.arch }}
          path: builder.tar.zst
          retention-days: 1
